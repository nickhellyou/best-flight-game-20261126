<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge Runner — Valley Flying from Kestrel Field</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Ridge Runner: fly the Kestrel K-2 through rings, beacons and landings over a river valley"></canvas>

<!-- HUD: lit instruments, read at a glance and in a screenshot. -->
<div id="hud">
  <div class="hud-top-left">
    <div class="inst"><span class="inst-label">ALT</span><span class="inst-value" id="hud-alt">0 ft</span></div>
    <div class="inst"><span class="inst-label">SPD</span><span class="inst-value" id="hud-spd">0 kt</span></div>
    <div class="inst"><span class="inst-label">HDG</span><span class="inst-value" id="hud-hdg">000° N</span></div>
    <div class="inst"><span class="inst-label">VSI</span><span class="inst-value" id="hud-vsi">+0 fpm</span></div>
  </div>

  <div class="hud-top-center">
    <canvas id="hud-compass" width="240" height="34"></canvas>
    <div id="hud-warn"></div>
  </div>

  <div class="hud-top-right">
    <div class="inst"><span class="inst-label">MISSION</span><span class="inst-value" id="hud-mission">RING RUN</span></div>
    <div class="inst"><span class="inst-label" id="hud-objective">Rings 0 / 6</span><span class="inst-value"><span id="hud-score">0</span> PTS</span></div>
    <div class="inst"><span class="inst-label">TIME</span><span class="inst-value" id="hud-time">5:00</span></div>
  </div>

  <div id="hud-radio" aria-live="polite"></div>
  <div id="hud-banner"></div>

  <div class="hud-bottom-left">
    <div class="gauge"><span class="gauge-label">THR</span><div class="gauge-bar"><div class="gauge-fill thr" id="hud-thr-fill"></div></div><span class="gauge-val" id="hud-thr-val">0%</span></div>
    <div class="gauge"><span class="gauge-label">FUEL</span><div class="gauge-bar"><div class="gauge-fill fuel" id="hud-fuel-fill"></div></div><span class="gauge-val" id="hud-fuel-val">100%</span></div>
    <div class="gauge"><span class="gauge-label">DMG</span><div class="gauge-bar"><div class="gauge-fill dmg" id="hud-dmg-fill"></div></div><span class="gauge-val" id="hud-dmg-val">0%</span></div>
    <div class="config-line"><span id="hud-gear" class="config on">GEAR DOWN</span><span id="hud-flaps" class="config">FLAPS UP</span></div>
  </div>

  <div class="hud-bottom-center">
    <canvas id="hud-attitude" width="120" height="120" aria-label="Attitude indicator"></canvas>
    <div class="attitude-caption">ATTITUDE</div>
  </div>

  <div class="hud-bottom-right">
    <canvas id="hud-minimap" width="180" height="180" aria-label="Valley map"></canvas>
    <div class="minimap-caption">KESTREL VALLEY</div>
  </div>
</div>

<!-- Title / pause / end overlay. Filled in by main.js. -->
<div id="overlay">
  <div class="overlay-card">
    <h1 id="overlay-title">Ridge Runner</h1>
    <p id="overlay-text"></p>
    <div id="overlay-hint"></div>
  </div>
</div>

<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
